# The project specifics the plan skills read (/plan, /spec, /refute, /land, /ordo-help, plan-orchestration).
# Every path is relative to the repository root. One project: the skills, their templates and utils/ are one tree with one set of checks.
roadmap: docs/roadmap.md                  # The source of truth for what is open; a plan is one entry of it.
verification: docs/dev/building.md        # The page that defines the green check; /plan copies its commands into the ledger.
rules: docs/dev/change-standard.md        # How a change is made; every brief points here first.
ledger_root: .scratch                     # A plan lives in <ledger_root>/<slug>/.
archive_root: .scratch/archive            # Where a closed plan's folder moves.
worktree_root: .agents/worktrees          # Where a step's worktree is created; ignored by .gitignore's .agents/* line.
worker: claude:sonnet                     # claude:<model> of the builder, for example claude:sonnet.
reviewer: claude:opus                     # claude:<model> the first run of /refute, the brief check and the lookups of /grill run on.
repair_reviewer: claude:sonnet            # claude:<model> the run of /refute over a repair round runs on: Sonnet, since that run checks a narrow delta against named findings at half Opus's price per token.
libraries: avoid                          # check: /spec looks for a library for every capability a step builds before it writes the brief; avoid: no new dependency.
standards: [docs/dev/skill-layout.md, skills/repo-setup/templates/docs/dev/prose-standard.md, docs/glossary.md] # Files every brief tells the builder to read in full, and the reviewer holds a diff to.
workers_at_once: 3                        # Steps in flight at once; above 1, two of them share a file only when the orchestrator judges the merge at landing simple (plan-orchestration, "Two steps in flight").
