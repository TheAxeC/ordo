# The project specifics the plan skills read (/plan, /spec, /refute, /land, /ordo-help, plan-orchestration).
# Every path is relative to the folder that holds this file. One project: the skills, their templates and utils/ are one tree with one set of checks.
roadmap: roadmap.md                       # The source of truth for what is open; a plan is one entry of it.
verification: dev/building.md             # The page that defines the green check; /plan copies its commands into the ledger.
rules: dev/change-standard.md             # How a change is made; every brief points here first.
ledger_root: ../.scratch                  # A plan lives in <ledger_root>/<slug>/.
archive_root: ../.scratch/archive         # Where a closed plan's folder moves.
worktree_root: ../.agents/worktrees       # Where a step's worktree is created; ignored by .gitignore's .agents/* line.
worker: claude:fable                      # claude:<model> of the builder, for example claude:sonnet.
worker_effort: low                        # The effort a builder runs at: low, medium, high, xhigh or max.
reviewer: claude:fable                    # claude:<model> the first run of /refute, the brief check, the diagnosis agent and the lookups of /grill run on.
reviewer_effort: low                      # The effort a reviewer, a brief-check agent and a lookup agent of /grill run at: low, medium, high, xhigh or max.
repair_reviewer: claude:sonnet            # claude:<model> the run of /refute over a repair round runs on: Sonnet, since that run checks a narrow delta against named findings at half Opus's price per token.
libraries: avoid                          # check: /spec looks for a library for every capability a step builds before it writes the brief; avoid: no new dependency.
standards: [dev/skill-layout.md, ../skills/ordo/ordo-init/templates/docs/dev/prose-standard.md, glossary.md] # Files every brief tells the builder to read in full, and the reviewer holds a diff to.
workers_at_once: 3                        # Steps in flight at once across every open plan; above 1, two of them share a file only when the orchestrator judges the merge at landing simple (plan-orchestration, "Two steps in flight").
self_rule: on                             # on: plan-orchestration runs a plan under self-rule, and /grill and /plan take --self-rule; off: every open item waits for the user.
next_entry: on                            # on, with self_rule on: after a plan closes, the orchestrator takes the next open roadmap entry; off: it stops at the closing.
