# Example .agents/plan.yaml for a repository with several projects. Copy it to .agents/plan.yaml and replace the names and paths.
# Each project takes the keys of plan.yaml, with the same required keys and the same defaults. A plan is then named <project>/<entry>.
# Every path is relative to the repository root, except launch_note, which is absolute.

projects:
  tool-a:
    roadmap: tools/tool-a/ROADMAP.md
    verification: tools/tool-a/docs/building.md
    rules: tools/tool-a/docs/change-standard.md
    ledger_root: tools/tool-a/.scratch
    archive_root: tools/tool-a/.scratch/archive
    worktree_root: .agents/worktrees
    worker: claude:opus
    reviewer: claude:opus
    standards: []
    worktree_paths: [tools/tool-a]
    worker_effort: high
    review: every
    refute_after_repair: yes
    repair_rounds: 1
    review_minutes: 0
    look: ""
    workers_at_once: 1
    bench: []
    launch_note: ""
  tool-b:
    roadmap: tools/tool-b/ROADMAP.md
    verification: tools/tool-b/docs/building.md
    rules: tools/tool-b/docs/change-standard.md
    ledger_root: tools/tool-b/.scratch
    archive_root: tools/tool-b/.scratch/archive
    worktree_root: .agents/worktrees
    worker: codex:gpt-5.6-sol
    reviewer: claude:opus
    standards: []
    worktree_paths: [tools/tool-b]
    worker_effort: high
    review: earned
    refute_after_repair: yes
    repair_rounds: 1
    review_minutes: 0
    look: ""
    workers_at_once: 1
    bench: []
    launch_note: ""
