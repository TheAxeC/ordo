# Example .agents/plan.yaml for a repository with one project. Copy it to .agents/plan.yaml and replace the paths.
# Every path is relative to the repository root. A required key that is missing stops the skill that needs it, and the refusal names the key.
# An optional key that is missing takes the default its comment gives.

roadmap: docs/roadmap.md                  # required. The source of truth for what is open; a plan is one entry of it.
verification: docs/dev/building.md        # required. The page that defines the green check; /plan copies its commands into the ledger.
rules: docs/dev/change-standard.md        # required. How a change is made; every brief points here first.
ledger_root: .scratch                     # required. A plan lives in <ledger_root>/<slug>/.
archive_root: .scratch/archive            # required. Where a closed plan's folder moves.
worktree_root: .agents/worktrees          # required. Where a step's worktree is created; add it to .gitignore.
worker: claude:opus                       # required. claude:<model> of the builder.
reviewer: claude:opus                     # required. claude:<model> the first run of /refute, the brief check and the lookups of /grill run on.
libraries: check                          # required. check: /spec looks for a library for every capability a step builds before it writes the brief; avoid: no new dependency.
standards: []                             # optional, default []. Files every brief tells the builder to read in full, and the reviewer holds a diff to.
worktree_paths: []                        # optional, default []. Sparse-checkout paths for a step's worktree; [] means the whole tree.
review: every                             # optional, default every. every, or earned (plan-orchestration, "The review, earned").
refute_after_repair: yes                  # optional, default yes. yes: /refute runs again over each repair round; no: the orchestrator's read of the round stands in.
repair_rounds: 1                          # optional, default 1. The most repair rounds a step gets; a refutation that finds nothing ends them early.
review_minutes: 0                         # optional, default 0. The reviewer's time box in minutes; 0 is none.
look: ""                                  # optional, default "". Where a changed view is opened at landing (a page, a command); "" means no look step.
workers_at_once: 1                        # optional, default 1. Steps in flight at once; above 1, two of them share a file only when the orchestrator judges the merge at landing simple (plan-orchestration, "Two steps in flight").
bench: []                                 # optional, default []. Binaries /spec stages and /land runs interleaved, base against new; [] means no A/B.
adr: docs/adr                             # optional, default docs/adr. The folder of architecture decision records: grill writes them, /plan, /spec and /refute read them.
design_bar: industry                      # optional, default industry. What grill's options are held to and what their reference line cites: industry (what production projects in the field ship), state-of-the-art (the best published work), novel (beyond both, with what would show it works).
design_references: []                     # optional, default []. Published standards a design is held to, such as WCAG 2.2 AA; grill cites them per option.
worker_effort: high                       # optional, default high. The effort a builder runs at: low, medium, high, xhigh or max.
reviewer_effort: high                     # optional, default high. The effort a reviewer, a brief-check agent and a lookup agent of /grill run at: low, medium, high, xhigh or max.
self_rule: off                            # optional, default off. on: plan-orchestration runs the plan under self-rule; off: every open item waits for the user.
next_entry: off                           # optional, default off. on, with self_rule on: after a plan closes, the orchestrator takes the next open roadmap entry; off: it stops at the closing.
repair_reviewer: claude:opus              # optional, default the reviewer value. claude:<model> the run of /refute over a repair round runs on, at reviewer_effort.
